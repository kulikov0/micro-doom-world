<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>micro-doom-world</title>
<meta name="description" content="A 39M-parameter world model draws every frame of a Doom-like game in your browser, from your keys.">
<script>
  if (matchMedia("(pointer: coarse)").matches || /[?&]touch\b/.test(location.search)) document.documentElement.classList.add("touch");
</script>
<style>
  :root { --bg: #0e0f11; --panel: #17191c; --text: #e6e6e6; --muted: #9aa0a6; --accent: #e8a33d; --line: #2a2d31; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  .game { display: grid; gap: 8px; }
  .screen { width: 100%; height: 384px; max-height: calc(100svh - 116px); display: grid; place-items: start;
            background: #000; border-radius: 4px; outline: none; }
  .frame { position: relative; width: 100%; height: 100%; background: #000; border-radius: 4px; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 10px; background: rgba(0, 0, 0, .72); color: #eee; text-align: center; padding: 16px; cursor: pointer; }
  .overlay[hidden] { display: none; }
  .overlay b { font-size: 18px; }
  .bar { width: min(320px, 80%); height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 10px; color: var(--muted); }
  .stats { margin-left: auto; font-variant-numeric: tabular-nums; }
  select, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
                   border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  .pad, .touch-hint { display: none; }
  .pad { position: relative; touch-action: none; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .knob { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; pointer-events: none;
          border: 2px solid var(--accent); background: rgba(232, 163, 61, .25); display: none; }
  #fire { position: absolute; right: 12px; bottom: 12px; width: 76px; height: 76px; border-radius: 50%; touch-action: none; }
  #fire.on { background: var(--accent); color: #000; }

  .touch body { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .touch main { padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 8px max(8px, env(safe-area-inset-left)); }
  .touch .pad { display: block; min-height: 170px; height: 34svh; }
  .touch .game { grid-template-columns: 1fr 1fr; grid-template-areas: "screen screen" "move turn"; }
  .touch .screen { grid-area: screen; height: auto; aspect-ratio: 4 / 3; max-height: none; background: none;
                   width: calc(100% + 16px); margin: 0 -8px; }
  .touch #pad-move { grid-area: move; }
  .touch #pad-turn { grid-area: turn; }
  .touch .keys-hint { display: none; }
  .touch .touch-hint { display: flex; }
  @media (orientation: landscape) {
    .touch main { max-width: none; }
    .touch .game { grid-template-columns: 1fr auto 1fr; grid-template-areas: "move screen turn"; }
    .touch .screen { width: auto; height: calc(100svh - 64px); margin: 0; }
    .touch .pad { height: auto; min-height: 0; }
    .touch .touch-hint { display: none; }
  }
</style>
</head>
<body>
<main>
  <div class="game">
    <div class="pad" id="pad-move" aria-label="move: drag; far: run"><i class="knob"></i></div>
    <div class="screen" id="screen" tabindex="0" aria-label="game screen: click, then play with the keyboard">
      <div class="frame" id="frame">
        <canvas id="view" width="128" height="96"></canvas>
        <div class="overlay" id="overlay">
          <b id="ov-title">Loading…</b>
          <div class="bar"><i id="ov-bar"></i></div>
          <span id="ov-text">model weights, ~170 MB</span>
        </div>
      </div>
    </div>
    <div class="pad" id="pad-turn" aria-label="turn: drag sideways"><i class="knob"></i><button id="fire">Fire</button></div>
  </div>
  <div class="row">
    <select id="level" aria-label="level"><option value="">random level</option></select>
    <button id="restart" title="R">New start</button>
    <span class="stats" id="stats"></span>
  </div>
  <div class="row keys-hint">WASD / ↑↓ move · ←→ turn · Shift run · Space fire · R new start · Esc pause</div>
  <div class="row touch-hint">left: drag to move, far to run · right: drag sideways to turn</div>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
